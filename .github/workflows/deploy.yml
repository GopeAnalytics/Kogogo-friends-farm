name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create GitHub Pages entry files
        run: |
          MAIN_JS=$(grep -rl "hydrateRoot(document" dist/client/assets/*.js | head -n 1)
          MAIN_CSS=$(find dist/client/assets -name "styles-*.css" | head -n 1)
          MAIN_JS_BASENAME=$(basename "$MAIN_JS")
          MAIN_CSS_BASENAME=$(basename "$MAIN_CSS")

          cat > dist/client/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>The Kogogo Farm Siaya</title>
              <meta name="description" content="Buy healthy poultry from The Kogogo Farm Siaya." />
              <link rel="stylesheet" href="/Kogogo-friends-farm/assets/${MAIN_CSS_BASENAME}" />
              <script type="module" crossorigin src="/Kogogo-friends-farm/assets/${MAIN_JS_BASENAME}"></script>
            </head>
            <body></body>
          </html>
          EOF

          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
